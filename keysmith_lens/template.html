<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/* Keysmith tokens: warm paper in light, graphite in dark, one copper accent.
   Layer colors are a separate, colorblind-checked categorical set. */
:root {
  --bg: #f5f1ea; --surface: #fbf9f5; --surface-2: #efeae1;
  --ink: #1c1915; --ink-2: #4d4740; --muted: #66605a;
  --line: rgba(28,25,21,.13); --line-2: rgba(28,25,21,.26); --wash: rgba(28,25,21,.05);
  --accent: #934c16; --accent-soft: rgba(147,76,22,.1);
  --l0: #2a78d6; --l1: #eb6834; --l2: #1baf7a; --l3: #eda100; --l4: #e87ba4; --l5: #008300;
  --critical: #d03b3b; --warning: #fab219;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Geist Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #131416; --surface: #1a1b1e; --surface-2: #202126;
  --ink: #f0ece5; --ink-2: #b0aaa1; --muted: #99938a;
  --line: rgba(240,236,229,.1); --line-2: rgba(240,236,229,.2); --wash: rgba(240,236,229,.05);
  --accent: #e39a5b; --accent-soft: rgba(227,154,91,.14);
  --l0: #3987e5; --l1: #d95926; --l2: #199e70; --l3: #c98500; --l4: #d55181; --l5: #008300;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; font: 13.5px/1.5 var(--sans); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 20px; height: 56px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: 9px; font: 600 15px var(--serif); letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 20px; height: 20px; color: var(--accent); }
header .sub { color: var(--muted); font: 12px var(--mono); white-space: nowrap; }
.legend { display: flex; gap: 14px; margin-left: auto; color: var(--ink-2); flex-wrap: wrap; font: 12px var(--mono); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.theme { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
.theme:hover { background: var(--wash); color: var(--ink); }
.theme svg { width: 16px; height: 16px; }
:root[data-theme="dark"] .theme .moon, :root:not([data-theme="dark"]) .theme .sun { display: none; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.sw.ring { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); }
.layout { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 56px); }
nav { border-right: 1px solid var(--line); overflow: auto; height: calc(100vh - 56px); position: sticky; top: 56px; padding-bottom: 24px; }
nav input { width: calc(100% - 24px); margin: 14px 12px 8px; padding: 7px 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); color: var(--ink); font: 12px var(--mono); }
nav input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
nav .h { padding: 14px 14px 4px; color: var(--muted); font: 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; }
nav button { all: unset; display: flex; align-items: center; gap: 8px; width: calc(100% - 28px); margin: 0 6px; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
nav button:hover { background: var(--wash); }
nav button[aria-current="true"] { background: var(--accent-soft); color: var(--ink); }
nav button[aria-current="true"] .lbl { font-weight: 600; }
nav button .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip { display: inline-flex; gap: 2px; }
.strip i { width: 6px; height: 10px; border-radius: 1px; display: inline-block; }
main { padding: 28px 36px 72px; min-width: 0; }
h2 { font: 500 26px/1.2 var(--serif); letter-spacing: -.012em; margin: 0 0 6px; }
h3 { font: 500 18px/1.3 var(--serif); margin: 36px 0 4px; }
.kicker { font: 11px var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; }
.cap { color: var(--muted); margin: 0 0 12px; max-width: 760px; }
.meta { font: 12px var(--mono); color: var(--muted); margin: 0 0 14px; }
.notes { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; }
.note { display: flex; gap: 10px; align-items: baseline; }
.note b { font: 600 10.5px var(--mono); padding: 2px 7px; border-radius: 4px; color: #fff; flex: none; text-transform: uppercase; letter-spacing: .04em; }
.note b.critical { background: var(--critical); }
.note b.warning { background: var(--warning); color: #1c1915; }
.note b.info { background: var(--surface-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.matrix { border-collapse: separate; border-spacing: 2px; }
.matrix th { font-weight: 500; color: var(--ink-2); text-align: left; padding: 0 10px 0 0; white-space: nowrap; }
.matrix thead th { color: var(--muted); font: 11px var(--mono); text-align: center; padding: 0 0 4px; cursor: pointer; }
.matrix thead th.sel { color: var(--ink); font-weight: 600; }
.cell { width: 64px; height: 26px; border-radius: 4px; font: 500 11px var(--mono); text-align: center; vertical-align: middle; color: #fff; cursor: pointer; }
.cell.absent { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); color: var(--muted); }
.cell.partial { background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(255,255,255,.55) 4px 6px); }
.cell.side { opacity: .45; }
.cell.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.ov .cell { width: 58px; height: 22px; }
.ov tbody tr { cursor: pointer; }
.ov tbody tr:hover th { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.ov td.num { color: var(--ink-2); font: 12px var(--mono); text-align: right; padding: 0 8px; }
.comp { display: grid; grid-template-columns: 112px 1fr 64px; gap: 6px 12px; align-items: center; }
.comp .k { color: var(--ink-2); font: 12px var(--mono); cursor: pointer; }
.comp .k.sel { color: var(--ink); font-weight: 600; }
.comp .v { color: var(--muted); font: 12px var(--mono); }
.bar { position: relative; height: 18px; display: flex; gap: 2px; }
.bar div { height: 100%; min-width: 1px; }
.bar div:first-child { border-radius: 4px 0 0 4px; }
.bar div:last-child { border-radius: 0 4px 4px 0; }
.bar .tick { position: absolute; top: -3px; width: 2px; height: 24px; background: var(--ink); border-radius: 1px; }
.bar .tick::after { content: ""; position: absolute; left: -6px; right: -6px; top: 0; bottom: 0; }
.comp .row.side { opacity: .45; }
.segs { display: flex; flex-direction: column; gap: 3px; margin-top: 10px; }
details.seg { background: var(--surface); border-radius: 8px; box-shadow: 0 0 0 1px var(--line); }
details.seg[open] { box-shadow: 0 0 0 1px var(--line-2); }
details.seg summary { display: grid; grid-template-columns: 6px 92px 220px 70px 1fr; gap: 10px; align-items: center; padding: 6px 12px 6px 0; cursor: pointer; list-style: none; }
details.seg summary::-webkit-details-marker { display: none; }
details.seg summary .c { height: 100%; min-height: 20px; border-radius: 8px 0 0 8px; }
details.seg summary .w { color: var(--muted); font: 11px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.seg summary .n { color: var(--ink-2); font: 12px var(--mono); text-align: right; }
.chip { font: 10.5px var(--mono); padding: 1px 6px; border-radius: 4px; margin-right: 4px; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-2); }
.chip.new { box-shadow: none; background: var(--surface-2); color: var(--ink); }
.chip.rule { box-shadow: none; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
pre { margin: 0; padding: 12px 16px; max-height: 420px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 12px/1.6 var(--mono); border-top: 1px solid var(--line); }
pre mark { background: var(--accent-soft); color: inherit; border-radius: 2px; box-shadow: 0 0 0 1px var(--accent); }
pre mark::before { content: attr(data-k); font: 600 10px var(--mono); color: var(--accent); margin-right: 5px; }
#tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line-2), 0 8px 24px rgba(0,0,0,.12); border-radius: 8px; padding: 7px 10px; font-size: 12px; display: none; z-index: 20; max-width: 360px; }
#tip strong { display: block; font-size: 13px; }
#tip .m { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.empty { color: var(--muted); padding: 40px 0; }
</style>
<script>
  // Theme before first paint; ?theme=light|dark wins (used for recordings).
  (function () {
    var q = new URLSearchParams(location.search).get("theme"), t;
    try { t = q || localStorage.getItem("ks-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="15.6" cy="8.4" r="5.6" stroke-width="1.7"/><circle cx="15.6" cy="8.4" r="2.3" stroke-width="1.3"/><path d="M11.6 12.4 3.6 20.4" stroke-width="1.9"/><path d="M7.1 16.9l1.9 1.9M4.9 19.1l1.5 1.5" stroke-width="1.9"/></svg>Keysmith Lens</div>
  <span class="sub" id="sub"></span>
  <div class="legend" id="legend"></div>
  <button class="theme" id="theme" type="button" aria-label="Toggle light / dark" title="Toggle light / dark" data-testid="theme"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="tip"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const LAYER_NAMES = { system: "system", user: "user", assistant: "assistant", tool_call: "tool call", tool_result: "tool result", tool_schema: "tool schema" };
const SHORT = { system: "sys", user: "user", assistant: "asst", tool_call: "call", tool_result: "result", tool_schema: "schema" };
const color = l => `var(--l${D.layers.indexOf(l)})`;
const ruleSort = (a, b) => a.localeCompare(b);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
};
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);

// tooltip
const tip = document.getElementById("tip");
function showTip(ev, value, ...lines) {
  tip.replaceChildren(el("strong", {}, value), ...lines.map(l => el("div", { class: "m" }, l)));
  tip.style.display = "block";
  const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px"; tip.style.top = (ev.clientY + 14) + "px";
}
const hideTip = () => { tip.style.display = "none"; };
const hover = (node, fn) => {
  node.addEventListener("pointermove", ev => showTip(ev, ...fn()));
  node.addEventListener("pointerleave", hideTip);
  return node;
};

// header
document.getElementById("sub").textContent = `${D.runs.length} runs · ${D.runs.reduce((a, r) => a + r.steps.length, 0)} model requests`;
const legend = document.getElementById("legend");
for (const l of D.layers) legend.append(el("span", {}, el("i", { class: "sw", style: `background:${color(l)}` }), LAYER_NAMES[l]));
legend.append(el("span", {}, el("i", { class: "sw ring" }), "rule absent"));

// rule status over a run: first layer it reached, worst status
function summarize(run, key) {
  let best = null;
  for (const st of run.steps) {
    if (st.side) continue;
    const [status, layers] = st.hits[key];
    if (status === "full") return { status, layer: layers[0] };
    if (status === "partial" && !best) best = { status, layer: layers[0] };
  }
  return best || { status: "absent" };
}
const severity = n => n.kind === "never" || n.kind === "dropped" ? "critical" : n.kind === "partial" ? "warning" : "info";

// nav
const nav = document.getElementById("nav");
let current = null;
function renderNav(filter = "") {
  const q = filter.toLowerCase();
  const input = el("input", { type: "search", placeholder: "Filter runs", value: filter, oninput: e => renderNav(e.target.value), "data-testid": "filter" });
  const kids = [input, el("button", { "aria-current": String(current === null), onclick: () => select(null), "data-testid": "nav-overview" }, el("span", { class: "lbl" }, "Overview: all runs"))];
  let lastHarness = null;
  for (const [i, run] of D.runs.entries()) {
    if (q && !(run.label + " " + run.harness).toLowerCase().includes(q)) continue;
    if (run.harness !== lastHarness) { kids.push(el("div", { class: "h" }, run.harness)); lastHarness = run.harness; }
    const strip = el("span", { class: "strip" });
    for (const r of run.rules.map(r => r.key).sort(ruleSort)) {
      const s = summarize(run, r);
      strip.append(el("i", { class: s.status === "absent" ? "sw ring" : "", style: s.status === "absent" ? "" : `background:${color(s.layer)}` }));
    }
    kids.push(el("button", { "aria-current": String(current === i), onclick: () => select(i), title: run.id, "data-testid": `nav-${run.label}` }, el("span", { class: "lbl" }, run.label), strip));
  }
  nav.replaceChildren(...kids);
  if (filter) { input.focus(); input.setSelectionRange(filter.length, filter.length); }
}

// overview: runs x rules
function renderOverview(main) {
  const keys = [...new Set(D.runs.flatMap(r => r.rules.map(x => x.key)))].sort(ruleSort);
  main.append(
    el("p", { class: "kicker" }, "Overview"),
    el("h2", {}, "Did each rule reach the model?"),
    el("p", { class: "cap" }, "One row per run. A filled cell is the layer where the rule first arrived; a ring means it never arrived in any agent request. Click a row to replay it."));
  const head = el("tr", {}, el("th"), ...keys.map(k => el("th", {}, k)), el("th", {}, "requests"), el("th", {}, "flags"));
  const body = el("tbody");
  for (const [i, run] of D.runs.entries()) {
    const tr = el("tr", { onclick: () => select(i), "data-testid": `ov-${run.label}` }, el("th", {}, run.label));
    for (const k of keys) {
      if (!run.rules.some(r => r.key === k)) { tr.append(el("td")); continue; }
      const s = summarize(run, k);
      const td = el("td", { class: `cell ${s.status}`, style: s.status === "absent" ? "" : `background-color:${color(s.layer)}` }, s.status === "absent" ? "—" : SHORT[s.layer]);
      hover(td, () => [s.status === "absent" ? "never arrived" : `${s.status} · ${LAYER_NAMES[s.layer]}`, `${k} · ${run.label}`, run.rules.find(r => r.key === k).origin]);
      tr.append(td);
    }
    const crit = run.notes.filter(n => severity(n) === "critical").length;
    tr.append(el("td", { class: "num" }, run.steps.filter(s => !s.side).length), el("td", { class: "num" }, crit || ""));
    body.append(tr);
  }
  main.append(el("table", { class: "matrix ov" }, el("thead", {}, head), body));
}

// run view
let selStep = 0;
function renderRun(main, run) {
  const agent = run.steps.filter(s => !s.side);
  const model = agent[0] ? agent[0].model : "";
  main.append(
    el("p", { class: "kicker" }, run.harness),
    el("h2", {}, run.label),
    el("p", { class: "meta" }, `${model} · ${agent.length} agent request(s)${run.steps.length > agent.length ? `, ${run.steps.length - agent.length} side request(s)` : ""} · ${run.id}`));

  if (run.notes.length) {
    const box = el("div", { class: "notes", "data-testid": "notes" });
    for (const n of run.notes) box.append(el("div", { class: "note" }, el("b", { class: severity(n) }, n.kind), n.text));
    main.append(box);
  }

  // rule tracking
  const keys = run.rules.map(r => r.key).sort(ruleSort);
  main.append(el("h3", {}, "Rule tracking"),
    el("p", { class: "cap" }, "Rows are rule files, columns are requests in order. Faded columns are side requests (e.g. title generation)."));
  const head = el("tr", {}, el("th"), ...run.steps.map((s, i) => el("th", { class: i === selStep ? "sel" : "", onclick: () => pick(i) }, s.side ? `${i + 1}·side` : i + 1)));
  const body = el("tbody");
  for (const k of keys) {
    const rule = run.rules.find(r => r.key === k);
    const tr = el("tr", {}, el("th", { title: rule.origin }, k));
    run.steps.forEach((st, i) => {
      const [status, layers, count] = st.hits[k];
      const cls = `cell ${status}${st.side ? " side" : ""}${i === selStep ? " sel" : ""}`;
      const td = el("td", { class: cls, "data-testid": `cell-${k}-${i + 1}`, style: status === "absent" ? "" : `background-color:${color(layers[0])}`, onclick: () => pick(i) },
        status === "absent" ? "—" : SHORT[layers[0]] + (count > 1 ? ` ×${count}` : ""));
      hover(td, () => [status === "absent" ? "absent" : `${status} · ${layers.map(l => LAYER_NAMES[l]).join(", ")}`, `${k} · request ${i + 1}`, rule.origin]);
      tr.append(td);
    });
    body.append(tr);
  }
  main.append(el("table", { class: "matrix", "data-testid": "tracking" }, el("thead", {}, head), body));

  // composition
  main.append(el("h3", {}, "What the model was sent"),
    el("p", { class: "cap" }, "Each bar is one request, to scale (characters), grouped by layer. Black ticks mark where rule text sits; hover one to name it."));
  const totals = run.steps.map(st => st.segs.reduce((a, s) => a + D.strings[s[3]].length, 0));
  const max = Math.max(1, ...totals);
  const comp = el("div", { class: "comp", "data-testid": "composition" });
  run.steps.forEach((st, i) => {
    const byLayer = D.layers.map(() => 0);
    for (const s of st.segs) byLayer[s[0]] += D.strings[s[3]].length;
    const bar = el("div", { class: "bar", style: `width:${(totals[i] / max) * 100}%` });
    byLayer.forEach((n, li) => {
      if (!n) return;
      const part = el("div", { style: `flex:${n};background:${color(D.layers[li])}` });
      hover(part, () => [fmt(n) + " chars", `${LAYER_NAMES[D.layers[li]]} · request ${i + 1}`, `${Math.round((n / totals[i]) * 100)}% of request`]);
      bar.append(part);
    });
    // rule ticks at their offset in the request, laid out in layer order like the bar
    const offsets = {}; let acc = 0;
    D.layers.forEach((_, li) => { offsets[li] = acc; acc += byLayer[li]; });
    const within = D.layers.map(() => 0);
    const seen = new Set();
    for (const s of st.segs) {
      const base = offsets[s[0]] + within[s[0]];
      for (const [a, , k] of s[5]) {
        if (seen.has(k)) continue;
        seen.add(k);
        const tick = el("i", { class: "tick", style: `left:calc(${((base + a) / totals[i]) * 100}% - 1px)` });
        hover(tick, () => [k, `${LAYER_NAMES[D.layers[s[0]]]} · ${s[1]}`, `request ${i + 1}`]);
        bar.append(tick);
      }
      within[s[0]] += D.strings[s[3]].length;
    }
    comp.append(
      el("div", { class: `k${i === selStep ? " sel" : ""}`, onclick: () => pick(i), "data-testid": `req-${i + 1}` }, `request ${i + 1}${st.side ? " · side" : ""}`),
      el("div", { class: `row${st.side ? " side" : ""}` }, bar),
      el("div", { class: "v" }, fmt(totals[i])));
  });
  main.append(comp);

  // step detail
  const st = run.steps[selStep];
  main.append(el("h3", {}, `Request ${selStep + 1}, piece by piece`),
    el("p", { class: "cap" }, `${st.source} · ${st.api}. "new" = not in the previous agent request. Click a row to read the text; rule lines are highlighted.`));
  const segs = el("div", { class: "segs", "data-testid": "segments" });
  for (const s of st.segs) {
    const layer = D.layers[s[0]];
    const text = D.strings[s[3]];
    const rules = [...new Set(s[5].map(x => x[2]))];
    const det = el("details", { class: "seg", "data-testid": `seg-${s[1]}` },
      el("summary", {},
        el("span", { class: "c", style: `background:${color(layer)}` }),
        el("span", {}, LAYER_NAMES[layer]),
        el("span", { class: "w", title: s[1] }, s[1] + (s[2] && s[2] !== layer ? ` · ${s[2]}` : "")),
        el("span", { class: "n" }, fmt(text.length)),
        el("span", {}, s[4] ? el("span", { class: "chip new" }, "new") : null, ...rules.map(k => el("span", { class: "chip rule" }, k)))));
    det.addEventListener("toggle", () => {
      if (!det.open || det.querySelector("pre")) return;
      const pre = el("pre");
      let pos = 0;
      for (const [a, b, k] of s[5]) {
        if (a < pos) continue;
        pre.append(text.slice(pos, a), el("mark", { "data-k": k }, text.slice(a, b)));
        pos = b;
      }
      pre.append(text.slice(pos));
      det.append(pre);
    });
    segs.append(det);
  }
  main.append(segs);
}

const mainEl = document.getElementById("main");
function render() {
  mainEl.replaceChildren();
  if (!D.runs.length) { mainEl.append(el("p", { class: "empty" }, "No runs with model requests were found.")); return; }
  if (current === null) renderOverview(mainEl); else renderRun(mainEl, D.runs[current]);
}
// #run=<label>&step=<n> links straight to a run and request
function syncHash() {
  const h = current === null ? "" : `#run=${encodeURIComponent(D.runs[current].label)}&step=${selStep + 1}`;
  history.replaceState(null, "", h || location.pathname);
}
function select(i) { current = i; selStep = 0; renderNav(nav.querySelector("input")?.value || ""); render(); syncHash(); scrollTo(0, 0); }
function pick(i) { selStep = i; const y = scrollY; render(); syncHash(); scrollTo(0, y); }
const q = new URLSearchParams(location.hash.slice(1));
if (q.get("run")) {
  const i = D.runs.findIndex(r => r.label === q.get("run"));
  if (i >= 0) { current = i; selStep = Math.max(0, Math.min(D.runs[i].steps.length - 1, (+q.get("step") || 1) - 1)); }
}
document.getElementById("theme").addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("ks-theme", t); } catch (e) {}
});
renderNav();
render();
</script>
</body>
