name: Site

# The site lives in site/ and is rebuilt from the current viewer on every push
# to main: the product film and tour clips are re-recorded from the real
# viewer, so a UI change reaches the site without anyone re-cutting videos.
on:
  push:
    branches: [main]
  release:
    types: [published]
  # Star counts and releases of the Keysmith family, without a commit.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Test the tool
        working-directory: .
        run: PYTHONPATH=. python -m unittest discover -s tests
      - run: pip install pillow
      - run: npm ci
      - name: Fonts for recording
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg >/dev/null
      - name: Re-record the film and tour from the current viewer
        env:
          CHROME: /usr/bin/google-chrome
        run: npm run viewer && npm run record
      - name: Refresh release data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Check links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/check-dist.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
